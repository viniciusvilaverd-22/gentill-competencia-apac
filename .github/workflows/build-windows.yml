name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'launcher/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable Windows x64
        shell: pwsh
        run: |
          dotnet publish launcher/GentillCompetenciaAPAC.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Self-test embedded v2.4.1 application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/Gentill_Competencia_APAC_v2.4.1.exe'
          if (!(Test-Path $exe)) { throw "Executável não foi gerado: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test falhou com código $($p.ExitCode)" }

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/Gentill_Competencia_APAC_v2.4.1.exe release/
          $hash = (Get-FileHash release/Gentill_Competencia_APAC_v2.4.1.exe -Algorithm SHA256).Hash.ToLower()
          "SHA-256  Gentill_Competencia_APAC_v2.4.1.exe`r`n$hash" | Set-Content release/SHA256.txt -Encoding utf8
          @"
          Gentill Competência APAC v2.4.1 — Conversão controlada

          Executável portátil para Windows x64.
          Não requer instalação do .NET.

          CORREÇÃO v2.4.1:
          - a competência do arquivo é mantida como origem ao carregar;
          - nenhuma competência de destino é escolhida automaticamente;
          - datas de encerramento são apenas lidas e exibidas como diagnóstico;
          - o operador escolhe manualmente mês/ano de destino;
          - somente campos estruturais de competência são alterados;
          - datas assistenciais permanecem byte a byte intactas;
          - divergências com risco de 010082 são sinalizadas/bloqueadas antes da geração.

          Ferramenta independente — não oficial DATASUS/MV.
          by Gentill Mob Ops · www.gentillops.com.br
          "@ | Set-Content release/LEIA-ME.txt -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gentill_Competencia_APAC_v2.4.1_Windows_x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release v2.4.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Gentill Competência APAC v2.4.1 — Conversão controlada

          Correção da lógica de seleção de competência da v2.4.0.

          ### Correções
          - remove seleção automática da competência baseada nas datas de encerramento;
          - mantém a competência realmente gravada no arquivo como origem;
          - encerramentos são exibidos somente para diagnóstico;
          - mês e ano de destino são sempre escolhidos pelo operador;
          - nenhuma data assistencial é criada, invertida ou reescrita;
          - conversão continua restrita aos campos estruturais de competência;
          - pré-validação 010082 permanece ativa.

          **A v2.4.1 substitui a v2.4.0 para uso operacional.**

          **Ferramenta independente — não oficial DATASUS/MV.**

          by Gentill Mob Ops · www.gentillops.com.br
          "@

          if (gh release view v2.4.1 2>$null) {
            gh release upload v2.4.1 release/Gentill_Competencia_APAC_v2.4.1.exe release/SHA256.txt release/LEIA-ME.txt --clobber
          } else {
            gh release create v2.4.1 release/Gentill_Competencia_APAC_v2.4.1.exe release/SHA256.txt release/LEIA-ME.txt --target "${{ github.sha }}" --title "Gentill Competência APAC v2.4.1" --notes $notes
          }
